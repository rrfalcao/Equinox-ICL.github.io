<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect with e.quinox</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

        <!-- CSS Files -->
        <link rel="stylesheet" href="static/auxcss/helper.css">
        <link rel="stylesheet" href="static/auxcss/header.css">
        <link rel="stylesheet" href="static/css/connect.css">

        <!-- Icons -->
        <link rel="apple-touch-icon" sizes="180x180" href="static/favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="static/favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="static/favicon_io/favicon-16x16.png">
        <link rel="manifest" href="static/favicon_io/site.webmanifest">
</head>
<body class="yellow greenbg">
        <div data-include-html="static/auxhtml/header.html"></div>
        <div class="connect-container">
            <div class="column">
                <picture>
                  <source type="image/webp"
                          srcset="static/images/solarpanel-800w.webp 800w, static/images/solarpanel-1600w.webp 1600w"
                          sizes="(max-width: 768px) 100vw, 60vw">
                  <img class="backgroundImg" src="static/images/solarpanel-1600w.jpg"
                       alt="Solar panel installation in rural Rwanda"
                       loading="lazy" decoding="async">
                </picture>
            </div>
            <div class="column">    
                <form action="https://api.staticforms.xyz/submit" method="post">
                    <input type="hidden" name="accessKey" value="3be223fa-aa8e-42dc-82ba-1f130932580a">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone <span class="optional">(optional)</span></label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>
                    <div class="form-group">
                        <label for="details">Details</label>
                        <textarea id="details" name="message" rows="5" required></textarea>
                    </div>
                    <input type="text" name="honeypot" tabindex="-1" aria-hidden="true" autocomplete="off" style="position:absolute;left:-10000px;opacity:0;">
                    <button class="submit-btn font24" type="submit">Send message</button>
                    <input type="hidden" name="redirectTo" value="https://equinox-icl.github.io">
                </form>
            </div>
        </div>
    <!-- JS Files -->
    <script src="static/js/include.js"></script>
    <script src="static/js/togglemenu.js"></script>
</body>
</html>
